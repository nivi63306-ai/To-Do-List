<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A responsive JavaScript To-Do List application with CRUD operations and local storage.">

    <title>Task Manager | To-Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="app">

        <section class="todo-card" aria-labelledby="app-title">

            <header class="app-header">

                <p class="eyebrow">JavaScript Project</p>

                <h1 id="app-title">My Task Manager</h1>

                <p>
                    Add, edit, complete and delete your tasks.
                </p>

            </header>


            <!-- Add Task Form -->

            <form id="todo-form" class="todo-form">

                <label for="todo-input" class="sr-only">
                    Enter a new task
                </label>

                <input
                    type="text"
                    id="todo-input"
                    name="task"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="150"
                    required>

                <button type="submit">
                    Add Task
                </button>

            </form>


            <!-- Filters -->

            <div
                class="filters"
                role="group"
                aria-label="Task filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                    aria-pressed="true">

                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active"
                    aria-pressed="false">

                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed"
                    aria-pressed="false">

                    Completed
                </button>

            </div>


            <!-- Task Statistics -->

            <div class="task-info">

                <span id="task-count">
                    0 tasks
                </span>

                <button
                    type="button"
                    id="clear-completed"
                    class="clear-btn">

                    Clear completed
                </button>

            </div>


            <!-- Dynamic Task List -->

            <ul
                id="todo-list"
                class="todo-list"
                aria-live="polite">
            </ul>


            <!-- Empty State -->

            <p
                id="empty-message"
                class="empty-message">

                No tasks yet. Add your first task!
            </p>

        </section>

    </main>

</body>
</html>
